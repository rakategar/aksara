<!doctype html><html><head><style>
@font-face{font-family:Fredoka;font-weight:700;src:url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent}
.i{width:512px;height:512px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#7FD0FF 0%,#2B92E8 45%,#1567C0 100%)}
.i.round{border-radius:112px}
.l{display:flex;gap:0;font:700 250px/1 Fredoka;-webkit-text-stroke:26px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(90,50,20,.38));margin-top:-10px}
.l span{display:inline-block}
.p{position:absolute;left:0;right:0;bottom:62px;text-align:center;font:700 58px/1 Fredoka;color:#FFF6E3;-webkit-text-stroke:10px #4A230C;paint-order:stroke fill;letter-spacing:.03em}
</style></head><body>
<div class="i ROUND"><div class="l"><span style="color:#F07A1E;transform:rotate(-4deg)">S</span><span style="color:#F5B400;transform:rotate(3deg)">J</span></div><div class="p">SIAKJADA</div></div>
</body></html>
