<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E7FD8">
<meta name="description" content="SIAKJADA – Sinau Aksara Jawa dengan Mudah. Media pembelajaran aksara Jawa kelas IV SDN Kendangsari II.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIAKJADA">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SIAKJADA – Sinau Aksara Jawa dengan Mudah</title>
<style>
html,body{margin:0;height:100%;background:#0f2233}
#sj-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#1a3a55,#0f2233 70%);color:#FBF1DC;font-family:system-ui,sans-serif;transition:opacity .45s ease}
#sj-loader.done{opacity:0;pointer-events:none}
#sj-loader .t{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:.04em;color:#FFD25E;text-shadow:0 4px 0 #4A230C}
#sj-loader .s{font-size:clamp(14px,2vw,18px);opacity:.85}
#sj-loader .bar{width:min(70vw,420px);height:16px;border-radius:999px;background:#4A230C;border:3px solid #C98A4B;overflow:hidden}
#sj-loader .fill{height:100%;width:0;background:linear-gradient(90deg,#F29A17,#FFD25E);border-radius:999px;transition:width .25s ease}
#sj-loader .p{font-size:15px;font-weight:700;color:#EED7A8}
</style>
</head>
<body>
<div id="sj-loader" role="progressbar" aria-label="Memuat SIAKJADA" aria-valuemin="0" aria-valuemax="100">
  <div class="t">SIAKJADA</div>
  <div class="s">Sinau Aksara Jawa dengan Mudah</div>
  <div class="bar"><div class="fill" id="sj-fill"></div></div>
  <div class="p" id="sj-pct">Memuat… 0%</div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
